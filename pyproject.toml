[project]
name = "oz-shared"
version = "0.2.0"
description = "Shared utilities across Oz's Python projects"
requires-python = ">=3.12, <3.14"
dependencies = [
    "onepassword-sdk>=0.4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
postgres = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]
storage = [
    "aioboto3>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
